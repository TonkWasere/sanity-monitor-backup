    <h1>🪨 Останавливающее действие</h1>

    <div>
                    <article>
                                <div class="PostUser"><h3 class="PostUser-name">Simera</h3></div>
                <div class="Post-body">
                    <p><img class="FoFUpload--Upl-Image-Preview" src="https://forum-cdn.exbo.net//2026-10-06/1791287271-857508-1920x1080-ru.png" title="1920x1080-ru.png" alt="" data-id="36f4a6eb-f3bb-48a9-99f0-4575224f57c5" loading="lazy" width="1920" height="1080"></p>

<p>Постой! Нет, правда, постой, хотя бы просто потому, что идти дальше ты и не сможешь — всю твою скорость «съело» останавливающее действие! А, 1,25 секунды уже прошло? Ну ладно, но статью прочитать всё равно стоит — полезно знать, как работает «останова», что она может сделать и как от неё защититься.</p>

<h2>Что такое останавливающее действие</h2>

<p>Останавливающее действие — негативный эффект, накладываемый при получении урона от пуль или взрыва.</p>

<p>Оно накладывает следующие штрафы: </p>

<ul><li>Восстановление выносливости: до -30%;</li>
<li>Скорость передвижения: до -60%.</li></ul>

<p>Работу останавливающего действия можно представить на примере заражения: на игрока накладываются «очки» заражения, и чем их больше, тем сильнее штрафы. Максимальное количество очков останавливающего действия, которое игрок может накопить, — 200.</p>

<p>За 1 секунду выводится 60% «очков» останавливающего действия. Полностью они выводятся за 1,25 секунды без наложения нового останавливающего действия.</p>

<p>Также останавливающее действие увеличивает урон, получаемый мутантами, по формуле:</p>

<p><strong>0,9 + (0,5 × ОД) / 100</strong></p>

<p>Например, при стрельбе по мутантам из LR-300 + 15 бронебойными патронами они получат следующий урон:</p>

<p><strong>43 x (0,9 + (0,5 × 40) / 100) = 47,3</strong></p>

<p>Именно «очки» останавливающего действия, а не урон, сбивают применение способностей противников в Операциях.</p>

<h2>Что такое стойкость</h2>

<p>Стойкость — параметр, снижающий получаемое останавливающее действие.</p>

<p>Итоговое снижение останавливающего действия зависит от двух параметров:</p>

<ul><li>защиты от разрыва;</li>
<li>стойкости.</li></ul>

<p>Снижение рассчитывается по формуле:</p>

<p><strong>(1 − (100 / (100 + Защита от разрыва)) × (1 − Стойкость / 100)) × 100</strong></p>

<p>Рассмотрим подробнее на примере «Центуриона».</p>

<p>По умолчанию у него 20% стойкости и 193 защиты от разрыва. Его снижение получаемого останавливающего действия будет рассчитываться так:</p>

<p><strong>(1 − (100 / (100 + 193)) × (1 − 20 / 100)) × 100 = 72,69</strong></p>

<p>Это означает, что всё входящее останавливающее действие будет снижено на 72,7%.</p>

<h2>Из чего складывается останавливающее действие</h2>

<p>Накладываемое останавливающее действие рассчитывается по формуле:</p>

<p><strong>Урон от попадания x (ОД патрона + ОД оружия) / 100</strong></p>

<p>Для примера возьмём WA-2000 + 15 со снаряжённым СБП-патроном:</p>

<ul><li>останавливающее действие патрона — 40;</li>
<li>останавливающее действие WA-2000 — 0;</li>
<li>урон WA-2000 — 139,5.</li></ul>

<p>Предположим, что у игрока нет пластины и многогранника.</p>

<p>Тогда выстрел наложит <strong>(139,5 x (40 + 0)) / 100 = 55,8</strong> «очков» останавливающего действия.</p>

<p>При попадании в голову будет наложено <strong>55,8 × 1,4 = 78,12</strong> «очков».</p>

<p>Урон, поглощаемый многогранником и пластиной, снижает накладываемое останавливающее действие. В свою очередь, поглощение урона пулестойкостью или защитой от взрыва останавливающее действие снижать не будет.</p>

<p>Для расчёта полученных «очков» останавливающего действия используется формула:</p>

<p><strong>ОД попадания x (1</strong> − <strong>итоговая стойкость / 100)</strong></p>

<p>Предположим, что игрок в «Центурионе» получит выстрел в тело из вышеупомянутой WA-2000, тогда он получит следующее количество «очков» останавливающего действия:</p>

<p><strong>55,8 × (1 − 72,69 / 100) = 15,23</strong></p>
